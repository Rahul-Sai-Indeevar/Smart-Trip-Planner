<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Trip Planner</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Font Awesome for emojis -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
        }

        #sidebar {
            width: 350px;
            background: #2c3e50;
            color: white;
            padding: 20px;
            overflow-y: auto;
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.5);
            z-index: 1000;
        }

        #map {
            flex-grow: 1;
            height: 100vh;
            z-index: 1;
        }

        h2 {
            margin-top: 0;
            color: #1abc9c;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }

        input,
        select {
            width: 100%;
            padding: 8px;
            border: none;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #1abc9c;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
        }

        button:hover {
            background: #16a085;
        }

        #results {
            margin-top: 20px;
            font-size: 14px;
        }

        .plan-card {
            background: #34495e;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 15px;
            border-left: 4px solid #1abc9c;
        }

        .plan-card h4 {
            margin: 0 0 10px 0;
            color: #f1c40f;
        }

        ul {
            padding-left: 20px;
            margin: 5px 0;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
            color: #f1c40f;
        }
        /* RAG Info Panel */
        #info-panel {
            position: absolute; top: 20px; right: 20px; width: 300px;
            background: #2c3e50; color: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); z-index: 2000;
            display: none; border-top: 5px solid #e74c3c;
        }
        #info-panel img { width: 100%; border-radius: 5px; margin-bottom: 10px; }
        #info-panel h3 { margin-top: 0; color: #e74c3c; }
        .close-btn { float: right; cursor: pointer; color: #bdc3c7; font-weight: bold; }
        .close-btn:hover { color: white; }
        /* Force all text generated by the AI to be readable on dark backgrounds */
        #ai-content, 
        #ai-content p, 
        #ai-content h1, 
        #ai-content h2, 
        #ai-content h3, 
        #ai-content h4, 
        #ai-content ul, 
        #ai-content li, 
        #ai-content span, 
        #ai-content strong, 
        #ai-content b {
            color: #ecf0f1 !important; /* Light gray/white */
            line-height: 1.6;
        }

        #ai-content h3, #ai-content h4 {
            color: #f1c40f !important; /* Make headers a nice yellow/gold */
            margin-top: 15px;
            margin-bottom: 5px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 5px;
        }

        #ai-content ul {
            padding-left: 20px;
        }
    </style>
</head>

<body>

    <div id="sidebar">
        <h2><i class="fa-solid fa-map-location-dot"></i> Trip Planner</h2>

        <div class="form-group">
            <label>From (e.g., Hyderabad, Chennai)</label>
            <input type="text" id="source" value="Hyderabad">
        </div>
        <div class="form-group">
            <label>Destinations (Comma separated)</label>
            <input type="text" id="destination" value="Chennai, Port Blair">
        </div>
        <div class="form-group">
            <label>Duration (Days)</label>
            <input type="number" id="days" value="3">
        </div>
        <div class="form-group">
            <label>Total Budget (₹)</label>
            <input type="number" id="budget" value="20000">
        </div>
        <div class="form-group">
            <label>Interests</label>
            <select id="preference">
                <option value="any">Any</option>
                <option value="adventure" selected>Adventure & Water</option>
                <option value="scenery">Scenery & Nature</option>
                <option value="historical">History & Culture</option>
            </select>
        </div>

        <button onclick="planTrip()">Plan My Trip</button>
        <div class="loading" id="loading">Calculating routes...</div>

        <div id="results"></div>
    </div>

    <div id="map"></div>
    <div id="info-panel">
        <span class="close-btn" onclick="document.getElementById('info-panel').style.display='none'">✖</span>
        <h3 id="info-title">City Name</h3>
        <img id="info-img" src="" alt="Location Image">
        <p id="info-desc" style="font-size: 14px; line-height: 1.5;"></p>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialize Map centered on India
        const map = L.map('map').setView([15.0, 80.0], 5);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        let mapLayers = []; // To keep track of lines and markers so we can clear them

        async function planTrip() {
            // Split the comma-separated string into an array of strings
            const destString = document.getElementById('destination').value;
            const destArray = destString.split(',').map(city => city.trim());

            const data = {
                source: document.getElementById('source').value,
                destinations: destArray, // Now passing an Array!
                days: parseInt(document.getElementById('days').value),
                budget: parseInt(document.getElementById('budget').value),
                preference: document.getElementById('preference').value
            };

            document.getElementById('loading').style.display = 'block';
            document.getElementById('results').innerHTML = '';

            try {
                const response = await fetch('http://127.0.0.1:8000/plan-trip', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.detail || "Could not find a route.");
                }

                const result = await response.json();
                currentGeneratedPlan = result; // Save for the AI generator
                displayResults(result);
                drawRouteOnMap(result);

            } catch (error) {
                document.getElementById('results').innerHTML = `<p style="color: #e74c3c;">${error.message}</p>`;
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        function displayResults(plan) {
            const resultsDiv = document.getElementById('results');

            // 1. Overall Summary Card
            let html = `
            <div class="plan-card" style="border-left-color: #2ecc71;">
                <h4><i class="fa-solid fa-circle-check"></i> Optimal TSP Route Found!</h4>
                <p><b>Total Trip Cost:</b> ₹${plan.total_cost}</p>
            </div>
        `;

            // 2. Transit Itinerary Card
            html += `
            <div class="plan-card" style="border-left-color: #3498db;">
                <h4><i class="fa-solid fa-route"></i> Transit Itinerary</h4>
                <ul style="list-style-type: none; padding-left: 0; margin-top: 10px;">
        `;

            plan.travel_route.legs.forEach((leg, index) => {
                const hours = Math.floor(leg.time_mins / 60);
                const mins = leg.time_mins % 60;
                const timeStr = hours > 0 ? `${hours}h ${mins}m` : `${mins}m`;

                // Font Awesome Transport Icons
                let icon = '<i class="fa-solid fa-plane"></i>';
                if (leg.mode === 'TRAIN') icon = '<i class="fa-solid fa-train"></i>';
                if (leg.mode === 'FERRY') icon = '<i class="fa-solid fa-ship"></i>';
                if (leg.mode === 'BUS' || leg.mode === 'ROAD') icon = '<i class="fa-solid fa-bus"></i>';

                html += `
                <li style="margin-bottom: 10px; font-size: 13px; background: rgba(0,0,0,0.2); padding: 8px; border-radius: 5px;">
                    <b style="color: #1abc9c;">Step ${index + 1}:</b> ${leg.from} <i class="fa-solid fa-arrow-right"></i> ${leg.to}<br>
                    <span style="color: #f1c40f;">${icon} ${leg.mode}</span> | <b>Cost:</b> ₹${leg.cost} | <b><i class="fa-regular fa-clock"></i> Time:</b> ${timeStr}
                </li>
            `;
            });
            html += `</ul></div>`;

            // 3. City Stop / Hotel / Activity Cards
            plan.itinerary.forEach((cityPlan, index) => {
                html += `
                <div class="plan-card">
                    <h4><i class="fa-solid fa-location-dot" style="color:#e74c3c;"></i> Stop ${index + 1}: ${cityPlan.city} (${cityPlan.days} Days)</h4>
                    <p><i class="fa-solid fa-bed"></i> Hotel: ${cityPlan.accommodation.name} (₹${cityPlan.accommodation.cost}/night)</p>
                    <p><i class="fa-solid fa-camera"></i> Activities included:</p>
                    <ul>
                        ${cityPlan.activities.map(a => `<li>${a.name} (₹${a.cost})</li>`).join('')}
                        ${cityPlan.activities.length === 0 ? "<li>Relaxing/Free Activities</li>" : ""}
                    </ul>
                </div>
            `;
            });

            // Add the AI Generate Button
            html += `
            <button id="ai-btn" onclick="generateAIItinerary()" style="background: linear-gradient(45deg, #8e44ad, #3498db); margin-top: 15px;">
                <i class="fa-solid fa-wand-magic-sparkles"></i> Generate AI Day-by-Day Itinerary
            </button>
            <div id="ai-result-box" style="margin-top: 15px; padding: 15px; background: #2c3e50; border-radius: 5px; display: none; font-size: 14px; border: 1px solid #8e44ad;">
                <div id="ai-loading" style="display:none; color:#f1c40f; text-align:center;"><i class="fa-solid fa-robot fa-bounce"></i> AI is writing your itinerary...</div>
                <div id="ai-content"></div>
            </div>
        `;

            resultsDiv.innerHTML = html;
        }

        function drawRouteOnMap(bestPlan) {
            // Clear previous routes/markers
            mapLayers.forEach(layer => map.removeLayer(layer));
            mapLayers = [];

            const legs = bestPlan.travel_route.legs;

            legs.forEach(leg => {
                // Determine line color based on transport mode
                let color = '#3498db'; // Default Blue
                if (leg.mode === 'TRAIN') color = '#2ecc71'; // Green
                if (leg.mode === 'FERRY') color = '#9b59b6'; // Purple
                if (leg.mode === 'BUS') color = '#f1c40f'; // Yellow

                // Draw Line
                const latlngs = [[leg.from_lat, leg.from_lon], [leg.to_lat, leg.to_lon]];
                const polyline = L.polyline(latlngs, { color: color, weight: 4, dashArray: leg.mode === 'FLIGHT' ? '10, 10' : '' }).addTo(map);
                mapLayers.push(polyline);

                // Draw Markers
                const marker1 = L.marker([leg.from_lat, leg.from_lon]).bindPopup(`<b>${leg.from}</b> (Click for info)`).addTo(map);
                const marker2 = L.marker([leg.to_lat, leg.to_lon]).bindPopup(`<b>${leg.to}</b> (Click for info)`).addTo(map);

                // Add click events to trigger AI RAG
                marker1.on('click', () => fetchLocationInfo(leg.from));
                marker2.on('click', () => fetchLocationInfo(leg.to));

                mapLayers.push(marker1, marker2);
                mapLayers.push(marker1, marker2);
            });

            // Auto-zoom map to fit the route
            const group = new L.featureGroup(mapLayers);
            map.fitBounds(group.getBounds(), { padding: [50, 50] });
        }

        async function fetchLocationInfo(locationName) {
            const panel = document.getElementById('info-panel');
            document.getElementById('info-title').innerText = locationName;
            document.getElementById('info-desc').innerText = "AI is generating description...";
            document.getElementById('info-img').src = "";
            panel.style.display = 'block'; // Show panel immediately

            try {
                const response = await fetch(`http://127.0.0.1:8000/location-info/${locationName}`);
                const data = await response.json();

                document.getElementById('info-desc').innerText = data.description;
                document.getElementById('info-img').src = data.image_url;
            } catch (error) {
                document.getElementById('info-desc').innerText = "Failed to load information.";
            }
        }

        async function generateAIItinerary() {
            if (!currentGeneratedPlan) return;

            document.getElementById('ai-result-box').style.display = 'block';
            document.getElementById('ai-loading').style.display = 'block';
            document.getElementById('ai-content').innerHTML = '';
            document.getElementById('ai-btn').style.display = 'none'; // Hide button while loading

            try {
                const response = await fetch('http://127.0.0.1:8000/generate-itinerary', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(currentGeneratedPlan)
                });

                const data = await response.json();
                document.getElementById('ai-content').innerHTML = data.html_itinerary;
            } catch (error) {
                document.getElementById('ai-content').innerHTML = "Failed to generate itinerary.";
            } finally {
                document.getElementById('ai-loading').style.display = 'none';
                document.getElementById('ai-btn').style.display = 'block';
                document.getElementById('ai-btn').innerHTML = '<i class="fa-solid fa-rotate-right"></i> Regenerate';
            }
        }
    </script>
</body>

</html>
